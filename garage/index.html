<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coachwork Garage Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@300..700&family=Jost:wght@300;400;500&family=Cormorant+Garamond:ital,wght@1,500&display=swap">
<style>
/* Layout: a night garage as a tool. The car stands on a polished floor in front of its own name in neon on the wall;
   the left rail picks the car (each loads only when chosen), the bottom rail is the rim library, the right rail the views,
   and the ignition (start button in a rev counter, lights and sound beside it) sits centre stage under the car. */
:root {
  --bg: #0b0b0d;
  --panel: rgba(16,16,19,.72);
  --fg: #eeebf0;
  --dim: #9a96a1;
  --line: rgba(238,235,240,.14);
  --accent: #c0485a;
  --head: "Oswald", "Arial Narrow", Impact, sans-serif;
  --thin: "Jost", "Futura", sans-serif;
  --serif: "Cormorant Garamond", Georgia, serif;
  color-scheme: dark;
}
* { box-sizing: border-box }
html, body { height: 100%; background: var(--bg) }
body { margin: 0; color: var(--fg); font-family: var(--thin); -webkit-font-smoothing: antialiased; overflow: hidden }
button { font: inherit; color: inherit }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none }
.lab { font-size: 10.5px; font-weight: 500; letter-spacing: .26em; text-transform: uppercase; color: var(--dim) }
.ui { position: fixed; z-index: 2; pointer-events: none; inset: 0; padding: max(18px, env(safe-area-inset-top, 0px)) max(18px, env(safe-area-inset-right, 0px)) max(18px, env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); display: grid; grid-template-columns: 250px 1fr 170px; grid-template-rows: auto 1fr auto; gap: 14px }
.ui > * { pointer-events: auto }
.mast { grid-column: 1 / 4; display: flex; align-items: baseline; gap: 14px }
.mast b { font-family: var(--head); font-weight: 600; font-size: 22px; letter-spacing: .06em }
.mast span { font-family: var(--serif); font-style: italic; font-size: 19px; color: var(--dim) }
#ign { grid-column: 2; grid-row: 2; align-self: end; justify-self: center; margin-bottom: 4px; --d: 128px; --side: 46px; gap: 14px }
.rims .spec { min-height: 4.1em }
.panel { background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); padding: 14px; display: grid; gap: 10px; align-content: start; min-width: 0 }
.cars { grid-column: 1; grid-row: 2; align-self: start }
.car { all: unset; cursor: pointer; display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: baseline; padding: 9px 8px; border-left: 2px solid transparent; transition: background-color .2s, border-color .2s }
.car .no { font-family: var(--head); font-weight: 300; font-size: 18px; color: var(--c) }
.car b { display: block; font-family: var(--head); font-weight: 500; font-size: 17px; letter-spacing: .01em; text-transform: uppercase; line-height: 1.05 }
.car i { display: block; font-style: normal; font-size: 11.5px; color: var(--dim); margin-top: 2px }
.car:hover { background: rgba(255,255,255,.04) }
.car[aria-pressed="true"] { border-left-color: var(--c); background: rgba(255,255,255,.06) }
.views { grid-column: 3; grid-row: 2; align-self: start }
.btn { all: unset; cursor: pointer; padding: 8px 11px; border: 1px solid var(--line); font-size: 11px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; text-align: center; transition: background-color .2s, border-color .2s, color .2s; user-select: none; -webkit-user-select: none; touch-action: none }
.btn:hover { border-color: rgba(238,235,240,.4) }
.btn[aria-pressed="true"], .btn.held { background: var(--fg); color: var(--bg); border-color: var(--fg) }
.rims { grid-column: 1 / 4; grid-row: 3; display: grid; grid-template-columns: auto 1fr auto; gap: 18px; align-items: center }
.rimlist { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px }
.rim { all: unset; cursor: pointer; flex: 0 0 auto; display: grid; justify-items: center; gap: 6px; width: 98px; padding: 10px 6px 8px; border: 1px solid var(--line); transition: border-color .2s, background-color .2s }
.rim svg { width: 54px; height: 54px; color: var(--fg) }
.rim span { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; text-align: center; line-height: 1.25 }
.rim[aria-pressed="true"] { border-color: var(--accent); background: rgba(255,255,255,.06) }
.fin { display: flex; flex-wrap: wrap; gap: 6px; max-width: 360px }
.chip { all: unset; cursor: pointer; display: inline-flex; gap: 8px; align-items: center; padding: 6px 10px 6px 7px; border: 1px solid var(--line); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase }
.chip i { width: 16px; height: 16px; border-radius: 50%; background: var(--sw); box-shadow: inset 0 -3px 5px rgba(0,0,0,.35), inset 0 2px 4px rgba(255,255,255,.3) }
.chip[aria-pressed="true"] { border-color: var(--accent) }
.chip:disabled { opacity: .35; cursor: default }
.spec { font-family: var(--serif); font-style: italic; font-size: 16px; color: var(--dim); max-width: 26ch }
.loader { position: fixed; z-index: 3; left: 50%; top: 46%; transform: translate(-50%, -50%); display: grid; justify-items: center; gap: 10px; transition: opacity .5s; pointer-events: none }
.loader i { display: block; width: 180px; height: 1px; background: var(--line); position: relative; overflow: hidden }
.loader i::after { content: ""; position: absolute; inset: 0; background: var(--fg); transform-origin: left; transform: scaleX(var(--p, 0)); transition: transform .25s }
.loader.off { opacity: 0 }
@media (max-width: 900px) {
  .ui { grid-template-columns: 1fr auto; grid-template-rows: auto auto 1fr auto auto; gap: 8px }
  .mast { grid-column: 1 / 3 } #ign { grid-column: 1 / 3; grid-row: 3; --d: 96px; --side: 40px; gap: 12px; margin-bottom: 0 }
  .mast b { font-size: 18px }
  .cars { grid-column: 1 / 3; grid-row: 2; display: flex; overflow-x: auto; padding: 8px; gap: 4px } .cars .lab { display: none }
  .car { flex: 0 0 auto; grid-template-columns: auto auto; padding: 6px 10px 6px 8px } .car i { display: none } .car b { font-size: 14px }
  .views { grid-column: 1 / 3; grid-row: 4; display: flex; overflow-x: auto; padding: 6px; gap: 6px } .views .lab { display: none } .views .btn { padding: 7px 10px; white-space: nowrap }
  .rims { grid-column: 1 / 3; grid-row: 5; grid-template-columns: 1fr; gap: 8px; padding: 8px } .rims .spec, .rims .lab { display: none }
  .rim { width: 74px; padding: 7px 4px 6px; gap: 4px } .rim svg { width: 36px; height: 36px } .rim span { font-size: 9.5px }
  .fin { flex-wrap: nowrap; overflow-x: auto; max-width: none; margin-top: 0 !important } .chip { flex: 0 0 auto; white-space: nowrap }
  .mast span { display: none }
}
</style>
</head>
<body style="margin:0">


<canvas id="c" role="img" aria-label="A car on a garage floor; choose a car, a rim and a view"></canvas>
<div class="loader lab" id="loader"><span id="loadTxt">Opening the garage</span><i></i></div>

<div class="ui">
  <header class="mast"><b>COACHWORK</b><span>Garage library · a supplement to issues 01–05</span></header>
  <nav class="panel cars" id="cars" aria-label="Cars"><span class="lab">The cars</span></nav>
  <div class="panel views" id="views" aria-label="Views"><span class="lab">Views</span></div>
  <div class="ignbox" id="ign" role="group" aria-label="Engine, lights and sound"></div>
  <section class="panel rims" aria-label="Rim library">
    <div><span class="lab">Rim library</span><p class="spec" id="rimSpec">Forged monoblock, 20 inch, mounted on the car's own tyres.</p></div>
    <div style="display:grid;gap:10px;min-width:0"><div class="rimlist" id="rimlist"></div></div>
    <div><span class="lab">Finish</span><div class="fin" id="fin" style="margin-top:8px"></div></div>
  </section>
</div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
<script type="module">
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';
// Scroll stage: one 3D model on a fixed, transparent canvas behind the whole page.
// Every element with data-pose='{...}' is a stop; as the page scrolls the camera glides from stop to stop
// (orbit yaw/pitch/distance round an anchor, lens, and a screen shift that moves the model left/right/up/down),
// holding while a stop's content is centred and easing between stops. Damped, with a slow idle drift and pointer parallax.
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

// Bloom that keeps a transparent canvas transparent: the stock blur writes alpha 1 everywhere, which would turn
// the page behind the model black, so its alpha follows the glow's own brightness instead.
function makeBloom(renderer, scene, camera, o = {}) {
  const composer = new EffectComposer(renderer);
  composer.setPixelRatio(renderer.getPixelRatio());
  composer.addPass(new RenderPass(scene, camera));
  // a mirror-sharp highlight can overflow the half-float buffer; one bad pixel then spreads through the blur as a
  // black block, so overflow and NaN are cleaned before the bloom
  composer.addPass(new ShaderPass({ uniforms: { tDiffuse: { value: null } },
    vertexShader: 'varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
    fragmentShader: 'uniform sampler2D tDiffuse; varying vec2 vUv; void main() { vec4 c = texture2D(tDiffuse, vUv); if (any(isnan(c)) || any(isinf(c))) c = vec4(0.0); c.rgb = min(c.rgb, vec3(40.0)); c.a = clamp(c.a, 0.0, 1.0); gl_FragColor = c; }' }));
  const bloom = new UnrealBloomPass(new THREE.Vector2(512, 512), o.strength ?? 0.55, o.radius ?? 0.55, o.threshold ?? 1.0);
  for (const m of bloom.separableBlurMaterials) {
    m.fragmentShader = m.fragmentShader.replace('gl_FragColor = vec4(diffuseSum/weightSum, 1.0);',
      'vec3 cc = diffuseSum / weightSum; gl_FragColor = vec4(cc, clamp(max(cc.r, max(cc.g, cc.b)), 0.0, 1.0));');
    m.needsUpdate = true;
  }
  composer.addPass(bloom);
  composer.addPass(new OutputPass());
  return { composer, bloom };
}

const DEG = Math.PI / 180;
const POSE_KEYS = ['yaw', 'pitch', 'dist', 'fov', 'tx', 'ty', 'tz', 'sx', 'sy', 'roll', 'lights', 'spin', 'env', 'drift', 'shadow'];
const BASE_POSE = { at: 'center', yaw: 30, pitch: 8, dist: 2.4, fov: 30, tx: 0, ty: 0, tz: 0, sx: 0, sy: 0, roll: 0, lights: 0, spin: 0, env: 1, drift: 1, shadow: 1 };

// A car-photography studio for reflections: a dim cyclorama, one long overhead softbox, two side strips, a rim light
// behind and a pale floor, so dark paint shows crisp highlight lines instead of a washed-out room.
function studioRoom(o = {}) {
  const k = Object.assign({ walls: 0.16, floor: 0.32, top: 7, strips: 4.5, rim: 3 }, typeof o === 'object' ? o : {});
  const room = new THREE.Scene();
  const box = new THREE.Mesh(new THREE.BoxGeometry(14, 8, 14), new THREE.MeshBasicMaterial({ side: THREE.BackSide }));
  box.material.color.setScalar(k.walls); box.position.y = 3.6; room.add(box);
  const glow = (w, h, v, pos, look) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ side: THREE.DoubleSide }));
    m.material.color.setScalar(v); m.position.set(...pos); m.lookAt(...look); room.add(m); return m;
  };
  glow(14, 14, k.floor, [0, -0.39, 0], [0, 10, 0]);
  glow(7, 2.4, k.top, [0, 5.2, 0], [0, 0, 0]);
  glow(0.35, 5, k.strips, [-4.2, 2.2, 0], [0, 1.4, 0]).rotation.z += 0;
  glow(0.35, 5, k.strips, [4.2, 2.2, 0], [0, 1.4, 0]);
  glow(4, 1.2, k.rim, [0, 2.4, -6.5], [0, 1, 0]);
  glow(2.5, 0.8, k.rim * 0.6, [0, 1.6, 6.5], [0, 1, 0]);
  return room;
}

function scrollStage(o) {
  const opt = Object.assign({ front: -1, ground: true, exposure: 1, envIntensity: 1, hold: 0.18, damp: 4.2, mobile: 700,
    key: { pos: [-4, 7, -3], intensity: 1.4, color: 0xffffff }, rim: { pos: [5, 3, 4], intensity: 0.8, color: 0xffffff } }, o);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const canvas = opt.canvas;
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = opt.exposure;
  const scene = new THREE.Scene();
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(opt.studio ? studioRoom(opt.studio) : new RoomEnvironment(), 0.02).texture;
  const camera = new THREE.PerspectiveCamera(30, 1, 0.01, 100);
  const key = new THREE.DirectionalLight(opt.key.color, opt.key.intensity); key.position.set(...opt.key.pos); scene.add(key);
  const rim = new THREE.DirectionalLight(opt.rim.color, opt.rim.intensity); rim.position.set(...opt.rim.pos); scene.add(rim);
  const holder = new THREE.Group(); scene.add(holder);
  renderer.setClearColor(0x000000, 0);
  const fx = opt.bloom ? makeBloom(renderer, scene, camera, opt.bloom) : null;

  const ctx = { THREE, scene, camera, renderer, holder, key, rim, anchors: { center: new THREE.Vector3() }, model: null, size: null, pose: { ...BASE_POSE }, opt, ready: null };

  /* ---------- load (base64 text or binary) ---------- */
  const loader = new GLTFLoader();
  if (opt.draco) loader.setDRACOLoader(new DRACOLoader().setDecoderPath(opt.draco));
  ctx.ready = new Promise((resolve, reject) => {
    const fail = (e) => { console.error(e); document.documentElement.classList.add('stage-error'); reject(e); };
    const done = (g) => { try { onModel(g); resolve(ctx); } catch (e) { fail(e); } };
    // capped: a server that compresses the file reports its smaller size as the total
    const prog = (e) => { if (e.total) opt.onProgress?.(Math.min(1, e.loaded / e.total)); };
    if (/\.txt$/.test(opt.url)) {
      new THREE.FileLoader().setResponseType('text').load(opt.url, (txt) => {
        const bin = atob(txt.trim()); const buf = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
        loader.parse(buf.buffer, '', done, fail);
      }, prog, fail);
    } else loader.load(opt.url, done, prog, fail);
  });

  function onModel(gltf) {
    const model = gltf.scene;
    model.updateMatrixWorld(true);
    // measured on the vertices: a rotated part's own box can reach well below its real shape (the Chiron stood 13 cm up)
    const box = new THREE.Box3().setFromObject(model, true);
    const size = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3());
    const L = Math.max(size.x, size.y, size.z);
    const s = 1 / L;
    const wrap = new THREE.Group();
    model.position.set(-c.x, opt.ground ? -box.min.y : -c.y, -c.z);
    wrap.add(model); wrap.scale.setScalar(s); holder.add(wrap);
    wrap.updateMatrixWorld(true);
    ctx.model = model; ctx.wrap = wrap; ctx.scale = s;
    ctx.size = size.clone().multiplyScalar(s);
    ctx.anchors.center.set(0, opt.ground ? ctx.size.y / 2 : 0, 0);
    model.traverse((m) => { if (m.isMesh) { m.frustumCulled = true; } });
    opt.onModel?.(ctx, gltf);
    if (opt.shadow !== false) addShadow();
    document.documentElement.classList.add('stage-ready');
    measure();
  }

  /* ---------- soft contact shadow ---------- */
  function addShadow() {
    const { x: w, z: l } = ctx.size;
    const c = document.createElement('canvas'); c.width = 256; c.height = 512; const g = c.getContext('2d');
    // soft shapes drawn through a shadow (canvas filters are missing on some browsers)
    const soft = (blur, draw) => { g.save(); g.shadowColor = 'rgba(0,0,0,.5)'; g.shadowBlur = blur; g.shadowOffsetX = 10000; g.translate(-10000, 0); g.fillStyle = '#000'; g.beginPath(); draw(); g.fill(); g.restore(); };
    soft(26, () => g.roundRect(56, 52, 144, 408, 70));
    for (const a of ctx.wheels || []) { const u = 128 + a.x / w * 175, v = 256 + a.z / l * 440; soft(12, () => g.ellipse(u, v, 20, 46, 0, 0, Math.PI * 2)); }
    const mat = new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false, toneMapped: false });
    const plane = new THREE.Mesh(new THREE.PlaneGeometry(w * 1.45, l * 1.14), mat);
    plane.rotation.x = -Math.PI / 2; plane.position.y = opt.ground ? 0.001 : -ctx.size.y / 2 - 0.02; plane.renderOrder = 1;
    holder.add(plane); ctx.shadow = plane;
  }

  /* ---------- stops ---------- */
  let stops = [];
  const isMobile = () => innerWidth < opt.mobile;
  function parse(el) {
    try {
      const p = JSON.parse(el.dataset.pose || '{}');
      if (isMobile() && el.dataset.poseM) Object.assign(p, JSON.parse(el.dataset.poseM));
      return p;
    } catch (e) { console.warn('bad pose', el, e); return {}; }
  }
  function measure() {
    const els = [...document.querySelectorAll('[data-pose]')];
    let prev = { ...BASE_POSE, ...(opt.basePose || {}) };
    stops = els.map((el) => {
      const r = el.getBoundingClientRect();
      const anchor = parseFloat(el.dataset.anchor || '0.5');
      const y = r.top + scrollY + r.height * anchor - innerHeight / 2;
      const p = { ...prev, ...parse(el) }; prev = p; // a stop inherits whatever it does not set
      return { el, y, p };
    }).sort((a, b) => a.y - b.y);
  }
  new ResizeObserver(() => { resize(); measure(); }).observe(document.body);
  addEventListener('load', measure);
  document.fonts?.ready.then(measure);

  /* ---------- target pose for the current scroll ---------- */
  const smooth = (t) => t * t * (3 - 2 * t);
  function targetPose() {
    const y = scrollY;
    if (!stops.length) return { ...BASE_POSE };
    if (y <= stops[0].y) return stops[0].p;
    const last = stops[stops.length - 1];
    if (y >= last.y) return last.p;
    let k = 0; while (k < stops.length - 1 && stops[k + 1].y <= y) k++;
    const a = stops[k], b = stops[k + 1];
    const t = (y - a.y) / Math.max(1, b.y - a.y);
    const h = opt.hold, e = smooth(Math.min(Math.max((t - h) / (1 - 2 * h), 0), 1));
    const out = { at: e < 0.5 ? a.p.at : b.p.at, _a: a.p.at, _b: b.p.at, _e: e };
    for (const k2 of POSE_KEYS) out[k2] = a.p[k2] + (b.p[k2] - a.p[k2]) * e;
    ctx.stopIndex = e < 0.5 ? k : k + 1; ctx.stopT = k + e;
    return out;
  }

  /* ---------- camera ---------- */
  const cur = { ...BASE_POSE }, curAt = new THREE.Vector3(), tmpA = new THREE.Vector3(), tmpB = new THREE.Vector3();
  let first = true;
  const pointer = { x: 0, y: 0, tx: 0, ty: 0 };
  addEventListener('pointermove', (e) => { if (e.pointerType === 'mouse') { pointer.tx = e.clientX / innerWidth * 2 - 1; pointer.ty = e.clientY / innerHeight * 2 - 1; } }, { passive: true });
  let lastY = scrollY, vel = 0;
  function anchorPoint(name, out) { const a = ctx.anchors[name] || ctx.anchors.center; return out.copy(a); }

  function resize() {
    const w = innerWidth, h = innerHeight;
    renderer.setSize(w, h, false); camera.aspect = w / h; fx?.composer.setSize(w, h);
  }
  resize();

  const clock = new THREE.Clock();
  let time = 0;
  function frame() {
    requestAnimationFrame(frame);
    const dt = Math.min(clock.getDelta(), 0.05); time += dt;
    const tp = targetPose();
    const k = (first || window.__stageSnap) ? 1 : 1 - Math.exp(-dt * (reduce ? 12 : opt.damp));
    for (const key2 of POSE_KEYS) cur[key2] += (tp[key2] - cur[key2]) * k;
    // the look-at point blends between the two stops' anchors
    anchorPoint(tp._a ?? tp.at, tmpA); anchorPoint(tp._b ?? tp.at, tmpB);
    tmpA.lerp(tmpB, tp._e ?? 0);
    curAt.lerp(tmpA, k); if (first || window.__stageSnap) curAt.copy(tmpA);
    first = !ctx.model;

    vel += ((scrollY - lastY) / Math.max(dt, 1e-3) - vel) * 0.1; lastY = scrollY;
    pointer.x += (pointer.tx - pointer.x) * 0.05; pointer.y += (pointer.ty - pointer.y) * 0.05;
    const drift = reduce ? 0 : cur.drift;
    const yaw = cur.yaw + Math.sin(time * 0.31) * 1.6 * drift + pointer.x * 5 * drift + THREE.MathUtils.clamp(vel * 0.004, -4, 4) * drift;
    const pitch = cur.pitch + Math.sin(time * 0.23) * 0.7 * drift - pointer.y * 2.5 * drift;
    const F = new THREE.Vector3(0, 0, opt.front);
    const dir = F.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw * DEG);
    const tgt = curAt.clone().add(new THREE.Vector3(cur.tx, cur.ty, cur.tz));
    const cp = Math.cos(pitch * DEG), sp = Math.sin(pitch * DEG);
    camera.position.set(tgt.x + dir.x * cp * cur.dist, tgt.y + sp * cur.dist, tgt.z + dir.z * cp * cur.dist);
    camera.up.set(0, 1, 0); camera.lookAt(tgt);
    if (cur.roll) camera.rotateZ(cur.roll * DEG);
    camera.fov = cur.fov;
    const W = innerWidth, H = innerHeight;
    camera.setViewOffset(W, H, -cur.sx * W, cur.sy * H, W, H);
    camera.updateProjectionMatrix();
    scene.environmentIntensity = opt.envIntensity * cur.env;
    key.intensity = opt.key.intensity * (0.15 + 0.85 * cur.env); rim.intensity = opt.rim.intensity * (0.3 + 0.7 * cur.env);
    if (ctx.shadow) ctx.shadow.material.opacity = cur.shadow;
    opt.onFrame?.(ctx, cur, dt, time);
    if (fx) fx.composer.render(dt); else renderer.render(scene, camera);
  }
  frame();
  ctx.measure = measure; ctx.fx = fx;

// Scale a word so it fills its container's content width (optionally capped by a share of the viewport height).
function fitWord(el, maxVh) {
  const fit = () => { const p = el.parentElement, cs = getComputedStyle(p);
    el.style.fontSize = '100px';
    const avail = p.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    let fs = 100 * avail / el.scrollWidth;
    if (maxVh) fs = Math.min(fs, innerHeight * maxVh);
    el.style.fontSize = fs + 'px'; };
  fit(); document.fonts?.ready.then(fit); new ResizeObserver(fit).observe(el.parentElement); el._fit = fit;
}

// Reveal: elements with .rv rise and fade in when they enter the viewport (visible at rest if observers are unavailable).
function reveals() {
  const els = document.querySelectorAll('.rv');
  if (!('IntersectionObserver' in window) || matchMedia('(prefers-reduced-motion: reduce)').matches) { els.forEach(e => e.classList.add('in')); return; }

  const io = new IntersectionObserver((es) => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { rootMargin: '0px 0px -8% 0px' });
  els.forEach(e => io.observe(e));
}

// Car kit: what every issue does to its car once loaded. Material roles by name (the car-mansion export's names),
// a flake paint with optional livery layers, anchors for the camera (wheels, lamps, tail, exhaust), turning wheels, a body
// on springs, the rim change (a portal on the floor), the engine (start, idle, rev, overrun) and the ignition control.

function carKit(ctx, cfg) {
  const { THREE } = ctx;
  const front = ctx.opt.front;
  const world = (o) => new THREE.Box3().setFromObject(o);
  const meshes = []; ctx.model.traverse((m) => { if (m.isMesh) meshes.push(m); });

    }
    s.fragmentShader = s.fragmentShader.replace('#include <common>', `#include <common>
uniform vec4 uArch[4]; uniform vec4 uArchAx[4]; uniform int uArchN;

      .replace('#include <color_fragment>', `#include <color_fragment>
  for (int i = 0; i < 4; i++) {
    if (i >= uArchN) break;
    vec3 d = vCarP - uArch[i].xyz, ax = uArchAx[i].xyz; float t = dot(d, ax); vec3 rv = d - ax * t; float rr = length(rv);

      .replace('#include <roughnessmap_fragment>', '#include <roughnessmap_fragment>\n  roughnessFactor = mix(roughnessFactor, 0.9, archK);')

  };

  /* ---------- paint with flake and livery layers ---------- */
  const U = {
    uFlake: { value: 1 }, uFlakeCol: { value: new THREE.Color(cfg.flakeColor || '#ffffff') },
    uSweep: { value: 0 }, uSweepCol: { value: new THREE.Color('#f0c419') }, uSweepA: { value: new THREE.Vector4() }, uSweepW: { value: 0 },
    uPin: { value: 0 }, uPinY: { value: 0 }, uPinW: { value: 0 }, uCarbonBelow: { value: -1 },
    uDecal: { value: null }, uDecalOn: { value: 0 }, uDecalBox: { value: new THREE.Vector4() }, uDecalCol: { value: new THREE.Color('#0d0d0e') },
  };
  const paint = new THREE.MeshPhysicalMaterial({ color: cfg.paints?.[0]?.color || '#300', metalness: cfg.matte ? 0.25 : 0.5,

  paint.onBeforeCompile = (s) => {
    Object.assign(s.uniforms, U);
    s.vertexShader = s.vertexShader.replace('#include <common>', '#include <common>\nvarying vec3 vCarP; varying vec3 vCarN;')
      .replace('#include <begin_vertex>', '#include <begin_vertex>\nvCarP = (modelMatrix * vec4(transformed, 1.0)).xyz; vCarN = normalize(mat3(modelMatrix) * objectNormal);');
    s.fragmentShader = s.fragmentShader.replace('#include <common>', `#include <common>
varying vec3 vCarP; varying vec3 vCarN;
uniform float uFlake; uniform vec3 uFlakeCol;
uniform float uSweep; uniform vec3 uSweepCol; uniform vec4 uSweepA; uniform float uSweepW;
uniform float uPin; uniform float uPinY; uniform float uPinW; uniform float uCarbonBelow;
uniform sampler2D uDecal; uniform float uDecalOn; uniform vec4 uDecalBox; uniform vec3 uDecalCol;
float carbonMask = 0.0;

      .replace('#include <color_fragment>', `#include <color_fragment>
  vec3 nC = normalize(vCarN);
  float side = smoothstep(0.45, 0.6, abs(nC.x));
  // a side line rising toward the tail: uSweepA = (z at its front, z at its rear, y at front, y at rear)
  if (uSweep > 0.5) {
    float t = (vCarP.z - uSweepA.x) / (uSweepA.y - uSweepA.x);
    float yc = mix(uSweepA.z, uSweepA.w, clamp(t, 0.0, 1.0));
    float band = 1.0 - smoothstep(uSweepW * 0.5, uSweepW * 0.5 + 0.0015, abs(vCarP.y - yc));

  }
  if (uPin > 0.5) {
    float pin = 1.0 - smoothstep(uPinW * 0.5, uPinW * 0.5 + 0.001, abs(vCarP.y - uPinY));

  vec3 fp = vCarP * 1500.0;
  float pxw = length(fwidth(fp));

  };

  /* ---------- material roles ---------- */
  const M = {
    glass: new THREE.MeshPhysicalMaterial({ color: 0x07070a, metalness: 0.1, roughness: 0.02, transparent: true, opacity: 0.5, envMapIntensity: 1.5 }),
    lens: new THREE.MeshPhysicalMaterial({ color: 0xffffff, metalness: 0, roughness: 0.02, transparent: true, opacity: 0.1, envMapIntensity: 1.5, depthWrite: false }),

    tyre: new THREE.MeshStandardMaterial({ color: 0x0f0f10, roughness: 0.78, metalness: 0, side: THREE.DoubleSide }),
    mesh: new THREE.MeshStandardMaterial({ color: 0x0b0b0c, roughness: 0.62, metalness: 0.25, side: THREE.DoubleSide }),
    carbon: new THREE.MeshPhysicalMaterial({ color: 0x0d0d0f, roughness: 0.38, metalness: 0.15, clearcoat: 1, clearcoatRoughness: 0.04 }),

  for (const m of meshes) {

    else if (/LensClear$/.test(n)) m.material = M.lens;

    else if (/GoldBolts$/.test(n)) bolts.push(m);
    else if (/_Caliper$/.test(n)) calipers.push(m);
    else if (/Tyre/.test(n)) m.material = M.tyre;
    else if (/GrilleMesh/.test(n)) m.material = M.mesh;

  const boltMat = bolts[0]?.material; const calMat = calipers[0]?.material?.clone(); if (calMat) calipers.forEach((m) => m.material = calMat);

  A.cabin = new THREE.Vector3(0, sz.y * 0.8, 0);

  // Wheels from the tyres. One wheel can be several tyre parts (the 812 has its sidewall lettering as a ring of its
  // own) and one part can hold two or four tyres (an axle). So the tyre points are pooled, split into one group per
  // wheel, and each group is measured: its axle (the direction its points spread least: steered or cambered wheels are
  // not square to the car), its centre, its outer radius, its inner radius (where a rim seats) and its width.
  const groups = [], v = new THREE.Vector3();

    const pos = m.geometry.attributes.position, n = pos.count, step = Math.max(1, Math.floor(n / 8000));
    const b = world(m), s = b.getSize(new THREE.Vector3()), c = b.getCenter(new THREE.Vector3());

    const P = g.pts, n = P.length;

    let xx = 0, xy = 0, xz = 0, yy = 0, yz = 0, zz = 0;
    for (const p of P) { const dx = p.x - c.x, dy = p.y - c.y, dz = p.z - c.z; xx += dx * dx; xy += dx * dy; xz += dx * dz; yy += dy * dy; yz += dy * dz; zz += dz * dz; }

  }
  ctx.wheels = wheels;
  wheels.slice(0, 4).forEach((w, i) => { AU.uArch.value[i].set(w.x, w.y, w.z, w.r); const a = w.axis || new THREE.Vector3(1, 0, 0); AU.uArchAx.value[i].set(a.x, a.y, a.z, (w.width || w.r) * 0.8); });

  for (const w of wheels) {
    const name = 'wheel' + (w.z * front > 0 ? 'F' : 'R') + (w.x > 0 ? 'p' : 'm');
    A[name] = new THREE.Vector3(w.x, w.y, w.z);
  }

    if (!list.length) return;

  cluster(has(/Exhaust/), 'exhaust');
  if (!A.exhaust) A.exhaust = A.rear.clone().setY(sz.y * 0.2);

  /* ---------- wheels and body: the unsprung parts on their own nodes, the body on springs above them ---------- */
  // A tyre that holds one wheel gets a pivot it turns on, with its rim and disc. A tyre shared across an axle can't turn
  // alone, so it goes on a fixed hub with the parts round it; calipers go on the hub too (they don't turn). The rest of

  pg.globalCompositeOperation = 'lighter';
  for (const u of [78, 178]) { pg.save(); pg.translate(u, 140); pg.scale(1, 2.8); const gr = pg.createRadialGradient(0, 0, 0, 0, 0, 62); gr.addColorStop(0, 'rgba(210,220,255,.5)'); gr.addColorStop(.5, 'rgba(190,200,255,.16)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); pg.fillStyle = gr; pg.beginPath(); pg.arc(0, 0, 62, 0, Math.PI * 2); pg.fill(); pg.restore(); }

  let mounted = [], hidden = [], forgedMat = null, lastFinish = null;
  const leaving = [];
  api.forged = false;

  const cap = new THREE.MeshPhysicalMaterial({ color: 0x0b0b0e, metalness: 0.3, roughness: 0.2, clearcoat: 1 });
  const hw = new THREE.MeshStandardMaterial({ color: 0xb48c3c, metalness: 1, roughness: 0.25 });

controls.enableDamping = true; controls.dampingFactor = 0.07; controls.minDistance = 0.3; controls.maxDistance = 3.6;
controls.maxPolarAngle = Math.PI * 0.495; controls.enablePan = false; controls.autoRotateSpeed = 0.6;

// a photo studio cyclorama: a curved wall that runs into the floor with no edge, a soft pool of light under the car,
// and the car's name in the paint of the far wall (seen from the front only)
const grad = (stops, w, h, radial) => { const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d');
  const gr = radial ? g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2) : g.createLinearGradient(0, h, 0, 0);
  stops.forEach(([o, col]) => gr.addColorStop(o, col)); g.fillStyle = gr; g.fillRect(0, 0, w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; };
const cyc = new THREE.Mesh(new THREE.CylinderGeometry(4.2, 4.2, 3.4, 128, 1, true),
  new THREE.MeshBasicMaterial({ map: grad([[0, '#2a2a30'], [0.18, '#18181c'], [0.6, '#0c0c0e'], [1, '#070708']], 8, 256), side: THREE.BackSide, fog: false }));
cyc.position.y = 1.7; scene.add(cyc);
// the floor is polished: it lets a little of what is mirrored under it show through (the neon's reflection)
const floor = new THREE.Mesh(new THREE.CircleGeometry(4.2, 128), new THREE.MeshStandardMaterial({
  map: grad([[0, '#64646c'], [0.22, '#424249'], [0.62, '#29292f'], [1, '#2e2e34']], 512, 512, true), roughness: 0.32, metalness: 0.05, transparent: true, opacity: 0.86 }));
floor.rotation.x = -Math.PI / 2; floor.renderOrder = -1; scene.add(floor);
scene.background = new THREE.Color(0x070708); scene.fog = null;

// The car's name in neon on the far wall: glass tubes bent round the letters, a white-hot core in a coloured tube with
// its halo, bright past 1.0 so the bloom takes it. It lights the floor and the back of the car in its colour (a soft
// area light, kept low so the paint still reads true) and shows in the floor. It strikes with a flicker for each car.
RectAreaLightUniformsLib.init();
// it stands where the opening view looks past the car, facing it, so the name reads behind the car
const NEON = { w: 3.3, h: 0.825, y: 0.345, at: new THREE.Vector3(-0.95, 0, 1.2).normalize().multiplyScalar(3.6) };
const neonYaw = Math.atan2(-NEON.at.x, -NEON.at.z);
const neonC = document.createElement('canvas'); neonC.width = 2048; neonC.height = 512;
const neonR = document.createElement('canvas'); neonR.width = 1024; neonR.height = 256;
const neonTex = new THREE.CanvasTexture(neonC), neonRTex = new THREE.CanvasTexture(neonR);
for (const tx of [neonTex, neonRTex]) { tx.colorSpace = THREE.SRGBColorSpace; tx.anisotropy = 8; }
const neonMat = new THREE.MeshBasicMaterial({ map: neonTex, transparent: true, depthWrite: false, toneMapped: false, blending: THREE.AdditiveBlending, color: 0x000000 });
const neon = new THREE.Mesh(new THREE.PlaneGeometry(NEON.w, NEON.h), neonMat);
neon.position.set(NEON.at.x, NEON.y, NEON.at.z); neon.rotation.y = neonYaw; scene.add(neon);
const neonReflMat = new THREE.MeshBasicMaterial({ map: neonRTex, transparent: true, depthWrite: false, toneMapped: false, blending: THREE.AdditiveBlending, color: 0x000000, side: THREE.DoubleSide });
const neonRefl = new THREE.Mesh(new THREE.PlaneGeometry(NEON.w, NEON.h), neonReflMat);
neonRefl.position.set(NEON.at.x, -NEON.y, NEON.at.z); neonRefl.rotation.y = neonYaw; neonRefl.scale.y = -1; neonRefl.renderOrder = -2; scene.add(neonRefl);
const neonLight = new THREE.RectAreaLight(0xffffff, 0, NEON.w * 0.7, NEON.h * 0.45);
neonLight.position.set(NEON.at.x * 0.98, NEON.y, NEON.at.z * 0.98); neonLight.lookAt(0, 0.2, 0); scene.add(neonLight);
let neonT = 9, neonCol = new THREE.Color();
// blurred strokes drawn through a shadow (canvas filters are missing on some browsers)
function glowText(g, txt, color, width, blur, alpha) {
  g.save(); g.globalAlpha = alpha; g.lineWidth = width; g.strokeStyle = color; g.shadowColor = color; g.shadowBlur = blur;
  g.shadowOffsetX = 10000; g.translate(-10000, 0); g.strokeText(txt, 0, 0); g.restore();
}
function drawNeon(g, W, H, txt, color, sc) {
  g.clearRect(0, 0, W, H); g.save();
  g.font = '600 380px Oswald, "Arial Narrow", sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineJoin = 'round'; g.lineCap = 'round';
  const k = Math.min(1, 1860 / g.measureText(txt).width) * sc; g.translate(W / 2, H * 0.53); g.scale(k, k);
  const core = '#' + new THREE.Color(color).lerp(new THREE.Color('#ffffff'), 0.72).getHexString();
  glowText(g, txt, color, 22, 60, 0.75); glowText(g, txt, color, 12, 16, 0.9);
  if (sc === 1) { g.lineWidth = 9; g.strokeStyle = color; g.strokeText(txt, 0, 0); g.lineWidth = 3; g.strokeStyle = core; g.strokeText(txt, 0, 0); }
  else glowText(g, txt, core, 14, 10, 0.8);
  g.restore();
}
function neonOn(name, color) {
  const txt = name.toUpperCase();
  drawNeon(neonC.getContext('2d'), 2048, 512, txt, color, 1); neonTex.needsUpdate = true;
  drawNeon(neonR.getContext('2d'), 1024, 256, txt, color, 0.5); neonRTex.needsUpdate = true;
  neonCol.set(color); neonLight.color.copy(neonCol); neonT = window.__stageSnap ? 9 : 0;
}
// the strike: a stutter, then the tubes fill
const neonLevel = (t) => t < 0.25 ? 0 : t < 0.32 ? 0.8 : t < 0.42 ? 0.05 : t < 0.47 ? 1 : t < 0.6 ? 0.25 : Math.min(1, 0.55 + (t - 0.6) * 1.6);

/* ---------- loading a car (one at a time; the last one is freed) ---------- */
const draco = new DRACOLoader().setDecoderPath('draco/');
const gl = new GLTFLoader().setDRACOLoader(draco);
const loader = document.getElementById('loader'), loadTxt = document.getElementById('loadTxt');
let current = null, kit = null, carCtx = null, rimTpl = {}, choice = { rim: 'y5', fin: 0 };
const MODEL_EXT = 'glb';   // 'glb' in the repository copies
const ISSUE_DIR = {"f812": "01-ferrari-812-superfast", "agera": "02-koenigsegg-agera", "chiron": "03-bugatti-chiron", "one1": "04-koenigsegg-one1", "projectone": "05-mercedes-amg-project-one"};   // each car's model lives in its issue's folder
function b64(url, onP) { url = url.replace(/\.txt$/, '.' + MODEL_EXT); if (MODEL_EXT === 'glb') return new Promise((res, rej) => new THREE.FileLoader().setResponseType('arraybuffer').load(url, res, (e) => e.total && onP?.(Math.min(1, e.loaded / e.total)), rej)); return new Promise((res, rej) => new THREE.FileLoader().setResponseType('text').load(url, (t) => { const bin = atob(t.trim()); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); res(u.buffer); }, (e) => e.total && onP?.(Math.min(1, e.loaded / e.total)), rej)); }
const parse = (buf) => new Promise((res, rej) => gl.parse(buf, '', res, rej));
function free(obj) { obj.traverse((o) => { o.geometry?.dispose(); const ms = Array.isArray(o.material) ? o.material : [o.material]; ms.forEach((m) => { if (!m) return; for (const k in m) if (m[k]?.isTexture) m[k].dispose(); m.dispose(); }); }); }

async function loadCar(c) {
  const token = (loadCar.t = (loadCar.t || 0) + 1);
  loader.classList.remove('off'); loader.style.setProperty('--p', 0); loadTxt.textContent = `${c.make} ${c.name}`;
  const buf = await b64(`../issues/${ISSUE_DIR[c.key]}/model.txt`, (p) => { loader.style.setProperty('--p', p); loadTxt.textContent = `${c.make} ${c.name} · ${Math.round(p * 100)}%`; });
  const g = await parse(buf);
  if (token !== loadCar.t) return;                      // another car was picked meanwhile
  if (current) { scene.remove(current); free(current); kit?.stop(); }
  const holder = new THREE.Group(); scene.add(holder); current = holder; holder.userData.key = c.key;
  const model = g.scene; model.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(model, true), size = box.getSize(new THREE.Vector3()), ctr = box.getCenter(new THREE.Vector3());
  const L = Math.max(size.x, size.y, size.z), s = 1 / L;
  const wrap = new THREE.Group(); model.position.set(-ctr.x, -box.min.y, -ctr.z); wrap.add(model); wrap.scale.setScalar(s); holder.add(wrap); wrap.updateMatrixWorld(true);
  carCtx = { THREE, holder, wrap, model, renderer, scale: s, size: size.clone().multiplyScalar(s), anchors: { center: new THREE.Vector3(0, size.y * s / 2, 0) }, opt: { front: -1 } };
  kit = carKit(carCtx, c.cfg);
  kit.setPaint(c.cfg.paints[0]);
  shadowFor(carCtx);
  neonOn(c.name, c.accent);
  document.documentElement.style.setProperty('--accent', c.accent);
  loader.classList.add('off');
  applyRims(true);
  setView(view, true);
}

function shadowFor(ctx) {
  const { x: w, z: l } = ctx.size;
  const cv = document.createElement('canvas'); cv.width = 256; cv.height = 512; const g = cv.getContext('2d');
  // soft shapes drawn through a shadow (canvas filters are missing on some browsers)
  const soft = (blur, draw) => { g.save(); g.shadowColor = 'rgba(0,0,0,.65)'; g.shadowBlur = blur; g.shadowOffsetX = 10000; g.translate(-10000, 0); g.fillStyle = '#000'; g.beginPath(); draw(); g.fill(); g.restore(); };
  soft(26, () => g.roundRect(56, 52, 144, 408, 70));
  for (const a of ctx.wheels || []) { const u = 128 + a.x / w * 175, v = 256 + a.z / l * 440; soft(12, () => g.ellipse(u, v, 20, 46, 0, 0, Math.PI * 2)); }
  const p = new THREE.Mesh(new THREE.PlaneGeometry(w * 1.45, l * 1.14), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(cv), transparent: true, depthWrite: false, toneMapped: false }));
  p.rotation.x = -Math.PI / 2; p.position.y = 0.002; ctx.holder.add(p); ctx.shadow = p;
}

/* ---------- rims (the car kit mounts them; templates are shared between cars) ---------- */
async function rimTemplate(id) {
  if (!rimTpl[id]) rimTpl[id] = b64(`rim-${id}.txt`).then(parse).then((g) => carKit.prepRim(THREE, g.scene));
  return rimTpl[id];
}
// a change of rims is a show: the portal opens, the car rises, the rims change, it drops and settles (carKit.swapRims)
async function applyRims(instant) {
  if (!kit) return;
  document.getElementById('fin').querySelectorAll('.chip').forEach((b) => b.disabled = choice.rim === 'factory');
  const k = kit, id = choice.rim;
  await k.swapRims(() => id === 'factory' ? null : rimTemplate(id), { instant });
  if (k !== kit || id !== choice.rim) return;
  k.setRim(id === 'factory' ? { factory: true } : FINISHES[choice.fin]);
}
function setFinish(f) { if (kit?.forged) kit.setRim(f); }

/* ---------- views ---------- */
const VIEWS = {
  'Three-quarter': (c) => ({ pos: [0.95, 0.3, -1.2], tgt: [0, 0.1, 0] }),
  'Side': (c) => ({ pos: [-1.75, 0.16, 0], tgt: [0, 0.1, 0] }),
  'Wheel': (c) => { const w = (c.wheels || []).find((w) => w.z < 0 && w.x < 0) || { x: -0.2, y: 0.07, z: -0.3, r: 0.07 }; return { pos: [w.x - 0.42, w.y + 0.04, w.z - 0.16], tgt: [w.x, w.y, w.z] }; },
  'Rear': (c) => ({ pos: [-0.75, 0.3, 1.25], tgt: [0, 0.1, 0] }),
  'Top': (c) => ({ pos: [0, 2.0, -0.02], tgt: [0, 0, 0] }),
};
let view = 'Three-quarter', fly = null;
// a narrow screen gets a wider lens and a camera further back, so the whole car stays in frame
const fitK = () => Math.max(1, 0.44 / (Math.tan(camera.fov * Math.PI / 360) * camera.aspect) / 1.3);
function setView(v, now) {
  view = v; if (!carCtx) return;
  const d = VIEWS[v](carCtx), k = fitK(), tg = new THREE.Vector3(...d.tgt);
  const to = new THREE.Vector3(...d.pos).sub(tg).multiplyScalar(k).add(tg);
  controls.maxDistance = 3.6 * k;
  fly = { from: camera.position.clone(), fromT: controls.target.clone(), to, toT: tg, t: now ? 1 : 0 };
  document.querySelectorAll('#views .btn[data-v]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.v === v));
}

/* ---------- the rails ---------- */
const carsEl = document.getElementById('cars');
CARS.forEach((c, i) => {
  const b = document.createElement('button'); b.className = 'car'; b.style.setProperty('--c', c.accent);
  b.innerHTML = `<span class="no">${c.no}</span><span><b>${c.make} ${c.name}</b><i>${c.paint}</i></span>`;
  b.addEventListener('click', () => { carsEl.querySelectorAll('.car').forEach((x) => x.setAttribute('aria-pressed', x === b)); loadCar(c).catch((e) => { console.error(e); loadTxt.textContent = 'This car could not be loaded. Pick another.'; }); });
  carsEl.appendChild(b);
});
const viewsEl = document.getElementById('views');
Object.keys(VIEWS).forEach((v) => { const b = document.createElement('button'); b.className = 'btn'; b.dataset.v = v; b.textContent = v; b.addEventListener('click', () => setView(v)); viewsEl.appendChild(b); });
const spin = document.createElement('button'); spin.className = 'btn'; spin.textContent = 'Turntable'; spin.setAttribute('aria-pressed', 'true');
spin.addEventListener('click', () => { controls.autoRotate = !controls.autoRotate; spin.setAttribute('aria-pressed', controls.autoRotate); }); viewsEl.appendChild(spin);
controls.autoRotate = true;
const rimEl = document.getElementById('rimlist');
RIMS.forEach((r) => {
  const b = document.createElement('button'); b.className = 'rim'; b.innerHTML = `<svg viewBox="0 0 64 64" aria-hidden="true">${ICONS[r.id]}</svg><span>${r.name}</span>`;
  b.setAttribute('aria-pressed', r.id === choice.rim); if (r.id === choice.rim) document.getElementById('rimSpec').textContent = r.spec;
  b.addEventListener('click', () => { choice.rim = r.id; rimEl.querySelectorAll('.rim').forEach((x) => x.setAttribute('aria-pressed', x === b)); document.getElementById('rimSpec').textContent = r.spec; applyRims(); });
  rimEl.appendChild(b);
});
const finEl = document.getElementById('fin');
FINISHES.forEach((f, i) => {
  const b = document.createElement('button'); b.className = 'chip'; b.innerHTML = `<i style="--sw:${f.color === 'paint' ? 'var(--accent)' : f.color}"></i>${f.name}`;
  b.setAttribute('aria-pressed', i === choice.fin);
  b.addEventListener('click', () => { choice.fin = i; finEl.querySelectorAll('.chip').forEach((x) => x.setAttribute('aria-pressed', x === b)); setFinish(f); });
  finEl.appendChild(b);
});

/* ---------- the ignition: built once, it drives whichever car is on the floor ---------- */
carKit.ignition(document.getElementById('ign'), () => kit);

/* ---------- loop ---------- */
function resize() {
  renderer.setSize(innerWidth, innerHeight, false); fx.composer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight;
  camera.fov = camera.aspect < 0.8 ? 46 : camera.aspect < 1.2 ? 38 : 32;
  // the car sits above the middle of the screen, clear of the ignition and the panels under it
  const dy = innerHeight * (innerWidth > 900 ? 0.1 : 0.045);
  camera.setViewOffset(innerWidth, innerHeight, 0, dy, innerWidth, innerHeight); camera.updateProjectionMatrix();
  if (carCtx && !fly) setView(view, true);
}
addEventListener('resize', resize); resize();
camera.position.set(0.95, 0.3, -1.2); controls.target.set(0, 0.1, 0);
const clock = new THREE.Clock();
controls.addEventListener('start', () => { fly = null; });
(function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05);
  if (fly) {
    fly.t = Math.min(1, fly.t + dt / 1.1); const e = 1 - Math.pow(1 - fly.t, 3);
    camera.position.lerpVectors(fly.from, fly.to, e); controls.target.lerpVectors(fly.fromT, fly.toT, e);
    if (fly.t >= 1) fly = null;
  }
  controls.update();
  kit?.frame({ lights: 0, env: 1, spin: 0 }, dt);
  neonT += dt; const nl = neonLevel(neonT);
  neonMat.color.copy(neonCol).lerp(new THREE.Color(1, 1, 1), 0.55).multiplyScalar(2.3 * nl);
  neonReflMat.color.setScalar(0.9 * nl); neonLight.intensity = 2.2 * nl;
  fx.composer.render(dt);
})();

window.__garage = { kit: () => kit, ctx: () => carCtx, wheels: () => carCtx?.wheels, cam: (p, t) => { fly = null; controls.autoRotate = false; camera.position.set(...p); controls.target.set(...t); controls.update(); } };
document.fonts?.load('600 100px Oswald').then(() => { const c = CARS.find((x) => x.key === current?.userData.key) || CARS.find((x) => x.key === 'agera'); const t0 = neonT; neonOn(c.name, c.accent); neonT = t0; });
carsEl.querySelectorAll('.car')[CARS.findIndex((c) => c.key === 'agera')].click();
</script>

</body>
